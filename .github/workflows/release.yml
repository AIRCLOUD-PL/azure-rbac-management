name: 'Release'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 'Create Release'
    runs-on: ubuntu-latest

    steps:
      # Idempotent: a release created by hand (gh release create) is left untouched,
      # a plain tag push gets a release with GitHub-generated notes.
      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          fi
